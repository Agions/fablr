[workspace]
members = [
    ".",
    "crates/models",
    "crates/db",
    "crates/media",
]
resolver = "2"

[package]
name = "fablr"
version = "2.2.1"
description = "fablr (剧工) - 开源 AI 影视/短剧解说创作平台 (Tauri 2 + Rust)。长视频/短剧拆条 + 多 Agent 智能剧本研磨 + 本地 Whisper 字幕 + 配音合成 + 剪映草稿导出与消重发布。"
authors = ["Agions <agions@qq.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "fablr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.0", features = ["test"] }

[dependencies]
models = { path = "crates/models" }
db = { path = "crates/db" }
media = { path = "crates/media" }
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
urlencoding = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "fs"] }
thiserror = "2"
reqwest = { version = "0.12", features = ["json"] }
once_cell = "1"
dirs = "6"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

[profile.release]
lto           = "fat"
codegen-units = 1
strip         = true
opt-level     = 3
panic         = "abort"
overflow-checks = false
